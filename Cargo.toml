[package]
name = "gitpulse"
version = "0.1.0"
edition = "2021"
authors = ["Euphoria911"]
description = "An interactive terminal dashboard for any git repository — commit heatmap, top authors, hot files, branches, all in one TUI."
license = "MIT"
repository = "https://github.com/Euphoria911/gitpulse"
readme = "README.md"
keywords = ["git", "tui", "dashboard", "terminal", "analytics"]
categories = ["command-line-utilities", "visualization"]

[lib]
name = "gitpulse"
path = "src/lib.rs"

[[bin]]
name = "gitpulse"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
git2 = { version = "0.19", default-features = false }
ratatui = "0.28"

[dev-dependencies]
tempfile = "3.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
